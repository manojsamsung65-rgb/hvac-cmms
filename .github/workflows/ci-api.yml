name: CI (api)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/ci-api.yml'

permissions:
  contents: read

jobs:
  api:
    name: API - lint, typecheck, unit, integration, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hvac_cmms_test
      SESSION_SECRET: ci-placeholder-not-a-real-secret-000000
      MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      # PostgreSQL is installed from the runner's package repository rather than a
      # Docker service container, to avoid Docker Hub pull rate limits.
      - name: Start PostgreSQL
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb hvac_cmms_test
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
